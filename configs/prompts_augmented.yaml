# AFFORD-Bench multi-tier language prompts for all 210 tasks.
#
# Generated 2026-10-08 from afford_pro/task_definitions.py (ALL_210_TASKS) plus
# hand-written prompt text. tests/test_prompts_augmented.py checks this file
# against the task definitions; rerun it whenever a TaskDef changes.
#
# Per-task fields
#   nominal_instruction  Verbatim TaskDef.instruction.
#   sim_grounding        What the simulator actually renders and checks:
#                        the single evaluated body, start/goal xyz in the world
#                        frame (Panda link0 at the origin, metres), the success
#                        thresholds used by the env serving the task, the
#                        minimum lift required before placement, and the
#                        initial TCP position when the arm does not start at
#                        the ready pose. Start positions are nominal: every
#                        reset rejection-samples the start of the body from
#                        U[-7, 7] cm in x and y, yaw U[-45, 45] deg and spawn
#                        roll/pitch U[-10, 10] deg (resolved by settling under
#                        gravity), shrinking the scatter when no valid resting
#                        start is found, and jitters the initial TCP by
#                        U[-1.5, 1.5] cm. Goal z is recalibrated at env
#                        construction to the settled resting height, so it can
#                        differ from goal_xyz_m by a few millimetres; goals
#                        with no stable resting pose are hold goals (the body
#                        must be held at the goal in a two-finger grasp).
#     distractors        true for D1, D3 and D7: two distractor bodies similar
#                        in color or shape are placed on the workspace.
#     referent_in_scene  false when the object the instruction names is not
#                        the simulated body (e.g. Task 208 names an ice tray but the
#                        env moves blue_block). For VLA language-grounding studies
#                        these tasks need new assets or new instructions.
#     instruction_covered_by_success
#                        false when the success predicate checks less than the
#                        instruction asks (every D5-D7 task, and every task with
#                        referent_in_scene false).
#     episode_terminates_after_subtask
#                        The env sets terminated=True the first time the
#                        terminal predicates hold. Any later atomic subtask is
#                        never required. For D5-D7 this is often step 1.
#   prompts
#     geometric_spatial    Explicit metric start/goal coordinates (world frame).
#     affordance_physical  Conditions on contact, friction, compliance and slip.
#                          Grasps are frictional (force-limited parallel jaw)
#                          and the L4 suite lowers pad and body friction to
#                          [0.12, 0.25] and scales mass by [1.8, 2.5], so the
#                          physical conditions in this tier are simulated; the
#                          bodies are rigid, so softness and compliance cues are
#                          wording only.
#     colloquial_terse     Short casual command.
#     atomic_subtasks      2-3 steps with pre/post predicates (AtomVLA-style
#                          decomposition).
#
# Predicate vocabulary
#   Sim-evaluable from MuJoCo state:
#     gripper_open       no finger in contact with the evaluated body
#     grasped(o)         both fingers in contact with o
#     at(o, start|goal)  |xy - p_xy| <= tolerance_xy_m, |z - p_z| <= tolerance_z_m,
#                        tilt from upright <= tilt_tolerance_deg, o supported
#                        by a non-robot body and at rest
#     above(o, p)        xy within tolerance_xy_m of p and z > p_z + 0.03 m
#     lifted(o, h)       z >= z_start + h (m)
#     tcp_near(goal)     ||tcp - goal|| < 0.10 m
#     tcp_at(goal)       ||tcp - goal|| <= tolerance_xy_m for 5 steps
#   All other predicates (seated, meshed, poured, clamped, ...) are symbolic.
#   The current simulator does not evaluate them.
#
# Sanity floors (scripts/sanity_baselines.py; per-task results in
# docs/reviews/sanity_baselines_2026-10-08.csv): no task succeeds at reset, and
# null and uniform-random policies solve none of the 210 tasks.
schema_version: 1
num_tasks: 210
tasks:
- task_number: 1
  task_id: industrial_shaft_assembly
  domain: D1_industrial
  task_type: insert
  nominal_instruction: Pick the machined transmission shaft from the inbound tray and seat it into the central assembly jig bore.
  sim_grounding:
    scene: industrial_assembly.xml
    object: machined_shaft
    start_xyz_m: [0.4, 0.24, 0.05]
    goal_xyz_m: [0.55, 0.0, 0.116]
    tolerance_xy_m: 0.002
    tolerance_z_m: 0.002
    tilt_tolerance_deg: 5.0
    distractors: true
    min_lift_m: 0.02
    init_tcp_xyz_m: null
    success_predicate: released (no finger contact), supported by a non-robot body and at rest, xy_err <= 0.0020 m, |z_err| <= 0.0020 m, tilt <= 5 deg, and peak lift >= 0.02 m
    terminal_predicates: ['at(machined_shaft, goal)', gripper_open]
    referent_in_scene: true
    instruction_covered_by_success: true
    episode_terminates_after_subtask: 3
  prompts:
    geometric_spatial: Grasp the machined shaft resting in the inbound tray at (0.400, 0.240, 0.050) m, lift it clear of the tray walls, and lower it with its axis vertical until it seats in the jig bore centered at (0.550, 0.000, 0.116) m.
    affordance_physical: Pinch the 32 mm steel shaft firmly enough that it cannot rotate in the fingers, hold its axis vertical over the bore, and descend slowly so the narrower pilot end enters first instead of catching on the bore rim.
    colloquial_terse: Shaft into the jig.
    atomic_subtasks:
    - step: 1
      instruction: Grasp the shaft in the inbound tray
      pre: [gripper_open, 'at(machined_shaft, start)']
      post: [grasped(machined_shaft)]
    - step: 2
      instruction: Carry the shaft over the jig bore with its axis vertical
      pre: [grasped(machined_shaft)]
      post: ['above(machined_shaft, goal)']
    - step: 3
      instruction: Lower the shaft into the bore and open the gripper
      pre: ['above(machined_shaft, goal)']
      post: ['at(machined_shaft, goal)', 'seated(machined_shaft, jig_bore)', gripper_open]
- task_number: 2
  task_id: industrial_gear_mesh
  domain: D1_industrial
  task_type: insert
  nominal_instruction: Pick the bronze spur gear from the feeder spindle and mesh it onto the transmission shaft in the jig.
  sim_grounding:
    scene: industrial_assembly.xml
    object: spur_gear
    start_xyz_m: [0.56, 0.18, 0.055]
    goal_xyz_m: [0.55, 0.0, 0.09]
    tolerance_xy_m: 0.002
    tolerance_z_m: 0.002
    tilt_tolerance_deg: 5.0
    distractors: true
    min_lift_m: 0.02
    init_tcp_xyz_m: null
    success_predicate: released (no finger contact), supported by a non-robot body and at rest, xy_err <= 0.0020 m, |z_err| <= 0.0020 m, tilt <= 5 deg, and peak lift >= 0.02 m
    terminal_predicates: ['at(spur_gear, goal)', gripper_open]
    referent_in_scene: true
    instruction_covered_by_success: true
    episode_terminates_after_subtask: 3
  prompts:
    geometric_spatial: Pick the spur gear from the feeder spindle at (0.560, 0.180, 0.055) m and lower it, hub down and bore concentric with the seated shaft, to the meshing height at (0.550, 0.000, 0.090) m.
    affordance_physical: Grip the 68 mm bronze gear across its rim, keep its face level so the bore does not bind on the shaft collar, and slide it down the shaft with light, steady pressure rather than forcing it.
    colloquial_terse: Gear onto the shaft.
    atomic_subtasks:
    - step: 1
      instruction: Lift the gear off the feeder spindle
      pre: [gripper_open, 'at(spur_gear, start)']
      post: [grasped(spur_gear)]
    - step: 2
      instruction: Center the gear bore over the seated shaft
      pre: [grasped(spur_gear)]
      post: ['above(spur_gear, goal)']
    - step: 3
      instruction: Slide the gear down onto the shaft and release
      pre: ['above(spur_gear, goal)']
      post: ['at(spur_gear, goal)', 'meshed(spur_gear, machined_shaft)', gripper_open]
- task_number: 3
  task_id: industrial_pin_insertion
  domain: D1_industrial
  task_type: insert
  nominal_instruction: Pick the hardened steel dowel pin from the feeder cup and insert it into the locating hole on the assembly jig.
  sim_grounding:
    scene: industrial_assembly.xml
    object: dowel_pin
    start_xyz_m: [0.42, 0.1, 0.035]
    goal_xyz_m: [0.55, 0.055, 0.08]
    tolerance_xy_m: 0.002
    tolerance_z_m: 0.002
    tilt_tolerance_deg: 5.0
    distractors: true
    min_lift_m: 0.02
    init_tcp_xyz_m: null
    success_predicate: released (no finger contact), supported by a non-robot body and at rest, xy_err <= 0.0020 m, |z_err| <= 0.0020 m, tilt <= 5 deg, and peak lift >= 0.02 m
    terminal_predicates: ['at(dowel_pin, goal)', gripper_open]
    referent_in_scene: true
    instruction_covered_by_success: true
    episode_terminates_after_subtask: 3
  prompts:
    geometric_spatial: Take the dowel pin from the feeder cup at (0.420, 0.100, 0.035) m and insert it vertically into the locating hole on the jig at (0.550, 0.055, 0.080) m.
    affordance_physical: The 16 mm pin is light and smooth, so close the fingers fully around the shank below the head, keep it plumb, and push it down gently so it does not tilt and wedge in the hole.
    colloquial_terse: Pin in the hole.
    atomic_subtasks:
    - step: 1
      instruction: Grasp the dowel pin from the feeder cup
      pre: [gripper_open, 'at(dowel_pin, start)']
      post: [grasped(dowel_pin)]
    - step: 2
      instruction: Align the pin vertically over the locating hole
      pre: [grasped(dowel_pin)]
      post: ['above(dowel_pin, goal)']
    - step: 3
      instruction: Insert the pin and release it
      pre: ['above(dowel_pin, goal)']
      post: ['at(dowel_pin, goal)', 'inserted(dowel_pin, locating_hole)', gripper_open]
- task_number: 4
  task_id: industrial_bearing_press
  domain: D1_industrial
  task_type: insert
  nominal_instruction: Pick the steel ball bearing ring from the parts tray and press it onto the jig shoulder.
  sim_grounding:
    scene: industrial_assembly.xml
    object: spur_gear
    start_xyz_m: [0.56, 0.18, 0.055]
    goal_xyz_m: [0.55, 0.0, 0.06]
    tolerance_xy_m: 0.002
    tolerance_z_m: 0.002
    tilt_tolerance_deg: 5.0
    distractors: true
    min_lift_m: 0.02
    init_tcp_xyz_m: null
    success_predicate: released (no finger contact), supported by a non-robot body and at rest, xy_err <= 0.0020 m, |z_err| <= 0.0020 m, tilt <= 5 deg, and peak lift >= 0.02 m
    terminal_predicates: ['at(spur_gear, goal)', gripper_open]
    referent_in_scene: false
    instruction_covered_by_success: false
    episode_terminates_after_subtask: 3
  prompts:
    geometric_spatial: Pick the bearing ring from the parts tray at (0.560, 0.180, 0.055) m and press it straight down onto the jig shoulder so that it rests at (0.550, 0.000, 0.060) m.
    affordance_physical: Hold the bearing ring by its outer race so the load passes through the race and not the balls, keep it square to the shoulder, and press with slow, even force; stop if it cocks sideways.
    colloquial_terse: Press the bearing on.
    atomic_subtasks:
    - step: 1
      instruction: Grasp the bearing ring by its outer race
      pre: [gripper_open, 'at(spur_gear, start)']
      post: [grasped(spur_gear)]
    - step: 2
      instruction: Square the ring over the jig shoulder
      pre: [grasped(spur_gear)]
      post: ['above(spur_gear, goal)']
    - step: 3
      instruction: Press the ring onto the shoulder and let go
      pre: ['above(spur_gear, goal)']
      post: ['at(spur_gear, goal)', 'pressed(bearing_ring, jig_shoulder)', gripper_open]
