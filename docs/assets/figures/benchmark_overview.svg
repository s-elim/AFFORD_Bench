<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <style>
      .bg { fill: #fcfdfe; }
      .title { font-family: 'Iowan Old Style', Georgia, serif; font-size: 20px; font-weight: 600; fill: #17191d; }
      .label { font-family: 'Open Sans', -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #62676e; text-transform: uppercase; letter-spacing: 0.05em; }
      .desc { font-family: 'Open Sans', -apple-system, sans-serif; font-size: 14px; fill: #202124; line-height: 1.5; }
      .box { rx: 8px; stroke-width: 1.5px; }
      .box-base { fill: #f3f5f8; stroke: #9ca6b1; }
      .box-dynamic { fill: #faf1f2; stroke: #a7444e; }
      .box-torque { fill: #f0f7f5; stroke: #3e857b; }
      .step { rx: 4px; fill: #ffffff; stroke: #9ca6b1; stroke-width: 1px; font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12px; font-weight: 600; text-anchor: middle; }
      .step-active { fill: #a7444e; stroke: #a7444e; fill: #ffffff; }
      .step-text { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12px; font-weight: 600; fill: #202124; text-anchor: middle; }
      .arrow { stroke: #62676e; stroke-width: 2px; marker-end: url(#arrowhead); }
      .arrow-red { stroke: #a7444e; stroke-width: 2.5px; marker-end: url(#arrowhead-red); }
      .metric-badge { rx: 4px; fill: #ffffff; stroke: #dce1e7; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#62676e" />
    </marker>
    <marker id="arrowhead-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a7444e" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" rx="10" stroke="#dce1e7" />

  <!-- Arm 1: Base Rollout -->
  <g transform="translate(40, 30)">
    <rect class="box box-base" width="1120" height="150" />
    <text x="30" y="35" class="label" fill="#62676e">ARM 1: BASE (NOMINAL CONTROL)</text>
    <text x="30" y="65" class="title">Nominal Task Execution under Frozen Seeds &amp; Initial States</text>
    
    <!-- Timeline Base -->
    <g transform="translate(30, 85)">
      <rect x="0" y="0" width="80" height="34" class="step" />
      <text x="40" y="22" class="step-text">Reset s₀</text>

      <line x1="85" y1="17" x2="125" y2="17" class="arrow" />

      <rect x="130" y="0" width="120" height="34" class="step" />
      <text x="190" y="22" class="step-text">Prefix a₀ : a_t*</text>

      <line x1="255" y1="17" x2="295" y2="17" class="arrow" />

      <rect x="300" y="0" width="140" height="34" class="step" />
      <text x="370" y="22" class="step-text">Continue Execution</text>

      <line x1="445" y1="17" x2="485" y2="17" class="arrow" />

      <rect x="490" y="0" width="110" height="34" class="step" fill="#eaf3ec" stroke="#2e7d32" />
      <text x="545" y="22" class="step-text" fill="#1b5e20">Success (100%)</text>
    </g>

    <!-- Force Reading Base -->
    <g transform="translate(730, 25)">
      <rect width="360" height="105" rx="6" fill="#ffffff" stroke="#dce1e7" />
      <text x="20" y="30" class="label">Sensed Physical Contact</text>
      <text x="20" y="60" font-family="'Iowan Old Style', Georgia, serif" font-size="24" fill="#2e7d32">F_max = 24.2 N</text>
      <text x="200" y="60" font-family="'Iowan Old Style', Georgia, serif" font-size="24" fill="#2e7d32">τ_act = 18.4 N·m</text>
      <text x="20" y="85" font-family="'Open Sans', sans-serif" font-size="12" fill="#62676e">Safe Compliance: No torque or force ceiling violation</text>
    </g>
  </g>

  <!-- Arm 2: Dynamic Counterfactual Rollout -->
  <g transform="translate(40, 210)">
    <rect class="box box-dynamic" width="1120" height="175" />
    <text x="30" y="35" class="label" fill="#a7444e">ARM 2: DYNAMIC (COUNTERFACTUAL INTERVENTION)</text>
    <text x="30" y="65" class="title">Matched Prefix Replay a₀:a_t* + Mid-Trajectory Disturbance Δx at t*</text>
    
    <!-- Timeline Dynamic -->
    <g transform="translate(30, 85)">
      <rect x="0" y="0" width="80" height="34" class="step" />
      <text x="40" y="22" class="step-text">Reset s₀</text>

      <line x1="85" y1="17" x2="125" y2="17" class="arrow" />

      <rect x="130" y="0" width="120" height="34" class="step" fill="#fff5f5" stroke="#a7444e" />
      <text x="190" y="22" class="step-text" fill="#a7444e">Replay a₀ : a_t*</text>

      <line x1="255" y1="17" x2="295" y2="17" class="arrow-red" />

      <rect x="300" y="0" width="140" height="34" class="step" fill="#a7444e" stroke="#88343d" />
      <text x="370" y="22" class="step-text" fill="#ffffff">Shift Δx (t*)</text>

      <line x1="445" y1="17" x2="485" y2="17" class="arrow-red" />

      <rect x="490" y="0" width="110" height="34" class="step" fill="#fbe9e7" stroke="#d32f2f" />
      <text x="545" y="22" class="step-text" fill="#c62828">Policy Reacts</text>
    </g>

    <text x="30" y="150" font-family="'Open Sans', sans-serif" font-size="13" fill="#62676e">
      Evaluates Compliant Dynamic Success: S_safe = Success ∧ (F_max ≤ 150 N) ∧ (|τ_j| ≤ τ_limit)
    </text>

    <!-- Force Reading Dynamic -->
    <g transform="translate(730, 25)">
      <rect width="360" height="125" rx="6" fill="#ffffff" stroke="#e3a1a7" />
      <text x="20" y="30" class="label" fill="#a7444e">Failure Modes Detected (Spikes &amp; Jams)</text>
      <text x="20" y="62" font-family="'Iowan Old Style', Georgia, serif" font-size="24" fill="#d32f2f">F_max &gt; 240 N</text>
      <text x="190" y="62" font-family="'Iowan Old Style', Georgia, serif" font-size="24" fill="#d32f2f">τ_act &gt; 87 N·m</text>
      <text x="20" y="90" font-family="'Open Sans', sans-serif" font-size="12" fill="#c62828">⚠ Safety Limit Exceeded: Jamming &amp; Motor Saturation</text>
      <text x="20" y="110" font-family="'Open Sans', sans-serif" font-size="12" fill="#62676e">Kinematic policies fail compliance even if parts align</text>
    </g>
  </g>
</svg>